<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AA.MITS HOSPITAL | Hospital Management</title>
  <style>
    :root { color-scheme: light; --ink:#172b4d; --muted:#77849a; --line:#e8edf3; --blue:#2878e8; --pale:#f5f8fc; font-family:Inter,"Segoe UI",Arial,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--pale); }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    [hidden] { display:none !important; }
    .auth-screen { min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:20px; background:linear-gradient(90deg,#0b2f6d26,#071e4333),url("/hospital-login.png") center/cover no-repeat; }
    .auth-card { width:min(420px,100%); padding:30px; border:1px solid #ffffffb8; border-radius:16px; background:#fffffff2; box-shadow:0 16px 48px #102e5a44; backdrop-filter:blur(8px); }
    .auth-brand { display:flex; align-items:center; gap:11px; margin-bottom:25px; font-size:19px; font-weight:750; }
    .brand-mark { width:36px; height:36px; display:grid; place-items:center; border-radius:12px; color:#fff; background:var(--blue); font-size:23px; }
    .auth-card h1 { margin:0; font-size:22px; }
    .auth-card .subtitle { margin:8px 0 20px; color:var(--muted); font-size:13px; line-height:1.55; }
    .auth-card form { display:grid; gap:14px; padding:0; }
    .auth-card label,.record-form label { display:grid; gap:6px; color:#53627a; font-size:11px; font-weight:650; }
    .auth-card input,.record-form input,.record-form select { width:100%; padding:11px; border:1px solid var(--line); border-radius:7px; color:var(--ink); background:#fff; font-size:13px; }
    input:focus,select:focus { border-color:#84b5f5; box-shadow:0 0 0 3px #eaf3ff; outline:0; }
    .primary,.secondary,.mini-button { border:0; border-radius:8px; padding:10px 14px; font-size:12px; font-weight:650; }
    .primary { color:white; background:var(--blue); }
    .primary:hover { background:#1768d7; }
    .secondary { color:#44536b; background:#edf1f6; }
    .auth-card .primary { width:100%; margin-top:4px; padding:12px; }
    .auth-switch { margin:18px 0 0; color:var(--muted); text-align:center; font-size:12px; }
    .text-button { border:0; padding:3px; color:var(--blue); background:transparent; font-size:12px; }
    .auth-message { min-height:18px; margin-top:12px; color:#bd4040; font-size:12px; line-height:1.45; }
    .auth-hint { margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; line-height:1.55; }
    .layout { min-height:100vh; display:grid; grid-template-columns:248px 1fr; }
    aside { padding:25px 16px; border-right:1px solid var(--line); background:white; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 10px 26px; font-size:18px; font-weight:750; }
    .nav-label { margin:7px 12px 10px; color:#a0a9b8; font-size:10px; font-weight:750; letter-spacing:1.2px; text-transform:uppercase; }
    nav { display:grid; gap:5px; }
    .nav-item { width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; border:0; border-radius:9px; color:#63718a; background:transparent; text-align:left; font-size:13px; }
    .nav-item:hover,.nav-item.active { color:var(--blue); background:#edf5ff; }
    .nav-icon { width:19px; text-align:center; }
    .sidebar-note { margin:25px 5px 0; padding:13px; border:1px solid var(--line); border-radius:10px; color:var(--muted); font-size:11px; line-height:1.55; }
    main { min-width:0; }
    header { min-height:70px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 35px; border-bottom:1px solid var(--line); background:#fff; }
    .crumb { color:var(--muted); font-size:13px; }
    .profile { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:650; }
    .avatar { width:32px; height:32px; display:grid; place-items:center; border-radius:50%; color:#2469cc; background:#e8f1ff; }
    .content { max-width:1480px; margin:auto; padding:30px 35px 48px; }
    .page-heading { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px; }
    h1 { margin:0; font-size:25px; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .welcome-banner { position:relative; isolation:isolate; display:flex; align-items:center; min-height:190px; margin-bottom:19px; padding:24px 29px; overflow:hidden; border-radius:14px; color:#fff; background:linear-gradient(120deg,#103c78,#176fcf); }
    .welcome-banner::after { position:absolute; z-index:0; inset:0 0 0 40%; background-image:linear-gradient(90deg,#176fcf 0%,#176fcf66 38%,#176fcf12 100%),url("/hospital-login.png"); background-repeat:no-repeat; background-position:center,right 48%; background-size:100% 100%,200% auto; content:""; }
    .welcome-content { position:relative; z-index:1; max-width:65%; }
    .welcome-kicker { color:#c4e0ff; font-size:10px; font-weight:750; letter-spacing:1.6px; text-transform:uppercase; }
    .welcome-banner h1 { margin-top:9px; font-size:clamp(23px,3vw,34px); letter-spacing:-.4px; }
    .welcome-banner p { margin:8px 0 15px; color:#e3efff; font-size:13px; }
    .welcome-button { border:0; border-radius:7px; padding:9px 13px; color:#1555a3; background:#fff; font-size:11px; font-weight:700; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:15px; margin-bottom:20px; }
    .stat,.panel { border:1px solid var(--line); border-radius:12px; background:#fff; }
    .stat { min-height:108px; padding:17px 19px; }
    .stat-top { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
    .stat-icon,.quick-icon { width:32px; height:32px; display:grid; place-items:center; border-radius:9px; color:var(--blue); background:#edf5ff; }
    .stat strong { display:block; margin-top:10px; font-size:24px; }
    .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr); gap:17px; }
    .panel { overflow:hidden; }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; padding:16px 19px; border-bottom:1px solid var(--line); }
    .panel-heading h2 { margin:0; font-size:14px; }
    .quick-actions { display:grid; gap:9px; padding:17px; }
    .quick-action { display:flex; align-items:center; gap:11px; width:100%; padding:12px; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#fff; text-align:left; font-size:12px; }
    .quick-action:hover { border-color:#b8d5fa; background:#f8fbff; }
    .section-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .search { width:min(320px,100%); padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:12px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    th { padding:12px 15px; color:#8995a8; background:#fbfcfe; text-align:left; font-size:10px; letter-spacing:.45px; text-transform:uppercase; }
    td { padding:13px 15px; border-top:1px solid #f0f2f6; color:#46556c; font-size:12px; }
    td:first-child { color:var(--ink); font-weight:650; }
    .status { display:inline-block; padding:5px 8px; border-radius:20px; color:#158765; background:#e9f8f2; font-size:10px; }
    .status.pending,.status.scheduled,.status.available { color:#a36c0a; background:#fff6df; }
    .status.cancelled,.status.unavailable,.status.occupied { color:#c34a4a; background:#fff0ef; }
    .actions { display:flex; gap:6px; }
    .mini-button { padding:6px 8px; color:var(--blue); background:#edf5ff; font-size:10px; }
    .mini-button.delete { color:#cc4545; background:#fff0ef; }
    .empty { padding:38px 16px; color:var(--muted); text-align:center; font-size:12px; }
    .overlay { position:fixed; inset:0; z-index:4; display:grid; place-items:center; padding:18px; background:#16264066; }
    .dialog { width:min(480px,100%); max-height:90vh; overflow-y:auto; border-radius:14px; background:#fff; box-shadow:0 18px 60px #10234233; }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; padding:19px 21px; border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:0; font-size:16px; }
    .close { border:0; color:var(--muted); background:transparent; font-size:22px; }
    .record-form { display:grid; gap:13px; padding:20px 21px; }
    .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:5px; }
    .toast { position:fixed; right:22px; bottom:22px; z-index:6; padding:12px 17px; border-radius:8px; color:#fff; background:#203957; font-size:12px; }
    @media(max-width:900px) { .layout{grid-template-columns:205px 1fr}.content{padding:25px 21px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr} }
    @media(max-width:620px) { .layout{display:block}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:4px 8px 12px}.nav-label,.sidebar-note{display:none}nav{display:flex;overflow-x:auto}.nav-item{width:auto;flex:0 0 auto;padding:9px}.nav-item span:last-child{display:none}header{min-height:58px;padding:10px 14px}.content{padding:21px 14px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.page-heading{align-items:flex-start}h1{font-size:21px}.section-toolbar{align-items:stretch;flex-direction:column}.crumb{font-size:11px}.profile{font-size:10px}.profile .secondary{padding:8px}.welcome-banner{min-height:175px;padding:20px 17px}.welcome-content{max-width:78%}.welcome-banner::after{left:32%;opacity:.8}.welcome-banner p{max-width:220px} }
  </style>
</head>
<body>
  <div id="auth-root"></div>
  <div id="app-root" hidden>
    <div class="layout">
      <aside>
        <div class="brand"><span class="brand-mark">+</span><span>AA.MITS HOSPITAL</span></div>
        <div class="nav-label">Main menu</div>
        <nav id="navigation"></nav>
        <div class="sidebar-note">AA.MITS HOSPITAL<br>Server-backed portal</div>
      </aside>
      <main>
        <header>
          <div class="crumb">AA.MITS HOSPITAL <span aria-hidden="true">/</span> <span id="breadcrumb">Dashboard</span></div>
          <div class="profile"><span class="avatar" id="profile-avatar">A</span><span id="profile-name">Administrator</span><button class="secondary" id="profile-button">Profile</button><button class="secondary" id="logout-button">Sign out</button></div>
        </header>
        <div class="content" id="content"></div>
      </main>
    </div>
    <div id="modal-root"></div>
  </div>
  <script src="/portal.js" defer></script>
</body>
</html>
